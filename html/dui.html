<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>État de la Plante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #app {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
        }

        #app.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .container {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 3px solid #4ade80;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(74, 222, 128, 0.3);
            animation: slideIn 0.4s ease;
        }

        .header {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .drug-label {
            text-align: center;
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .progress-section {
            margin-bottom: 25px;
        }

        .progress-label {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-percent {
            font-weight: 700;
            font-size: 18px;
            color: white;
        }

        .progress-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            height: 40px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--color-start), var(--color-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(74, 222, 128, 0.3);
            transform: translateY(-2px);
        }

        .stat-label {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-icon {
            font-size: 18px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        .stat-value.active {
            color: #4ade80;
        }

        .stat-value.inactive {
            color: #ef4444;
        }

        .timer-section {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(74, 222, 128, 0.4);
        }

        .timer-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(0, 0, 0, 0.7);
        }

        .timer-value {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .close-hint {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
            font-style: italic;
        }

        .close-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'Courier New', monospace;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">🌱 ÉTAT DE LA PLANTE</div>
            <div class="drug-label" id="drugLabel">Cannabis</div>

            <div class="progress-section">
                <div class="progress-label">
                    <span>Croissance</span>
                    <span class="progress-percent" id="progressPercent">0%</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%; --color-start: #f87171; --color-end: #ef4444;">
                        <span id="progressText">0%</span>
                    </div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">
                        <span class="stat-icon">💧</span>
                        <span>Arrosage</span>
                    </div>
                    <div class="stat-value" id="waterStatus">❌</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">
                        <span class="stat-icon">🌱</span>
                        <span>Engrais</span>
                    </div>
                    <div class="stat-value" id="fertStatus">❌</div>
                </div>
            </div>

            <div class="timer-section">
                <div class="timer-label">Temps restant</div>
                <div class="timer-value" id="timerValue">00:00</div>
            </div>

            <div class="close-hint">
                Appuyez sur <kbd>X</kbd> pour fermer
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('message', function(event) {
            const data = event.data;

            if (data.action === 'show') {
                document.getElementById('app').classList.add('show');

                // Mettre à jour les données
                document.getElementById('drugLabel').textContent = data.drugLabel || 'Plante';

                const percent = data.growthPercent || 0;
                document.getElementById('progressPercent').textContent = percent + '%';
                document.getElementById('progressText').textContent = percent + '%';

                const progressBar = document.getElementById('progressBar');
                progressBar.style.width = percent + '%';

                // Changer la couleur selon le pourcentage
                if (percent >= 100) {
                    progressBar.style.setProperty('--color-start', '#4ade80');
                    progressBar.style.setProperty('--color-end', '#22c55e');
                } else if (percent >= 66) {
                    progressBar.style.setProperty('--color-start', '#fbbf24');
                    progressBar.style.setProperty('--color-end', '#f59e0b');
                } else if (percent >= 33) {
                    progressBar.style.setProperty('--color-start', '#fb923c');
                    progressBar.style.setProperty('--color-end', '#f97316');
                } else {
                    progressBar.style.setProperty('--color-start', '#f87171');
                    progressBar.style.setProperty('--color-end', '#ef4444');
                }

                // Statuts
                const waterStatus = document.getElementById('waterStatus');
                waterStatus.textContent = data.watered ? '✅' : '❌';
                waterStatus.className = 'stat-value ' + (data.watered ? 'active' : 'inactive');

                const fertStatus = document.getElementById('fertStatus');
                fertStatus.textContent = data.fertilized ? '✅' : '❌';
                fertStatus.className = 'stat-value ' + (data.fertilized ? 'active' : 'inactive');

                // Timer
                document.getElementById('timerValue').textContent = data.timeText || '00:00';
            }

            if (data.action === 'hide') {
                document.getElementById('app').classList.remove('show');
            }
        });

        // Fermer avec Escape ou X
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.key === 'x' || e.key === 'X') {
                fetch(`https://${GetParentResourceName()}/close`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
            }
        });
    </script>
</body>
</html>
