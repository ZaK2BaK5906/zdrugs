<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>État Plante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #app {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        #app.show {
            display: block;
            animation: slideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8) rotateX(20deg);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotateX(0deg);
            }
        }

        .container {
            background: linear-gradient(135deg,
                rgba(15, 23, 42, 0.98) 0%,
                rgba(30, 41, 59, 0.98) 100%);
            border: 3px solid;
            border-image: linear-gradient(135deg, #4ade80, #22c55e, #16a34a) 1;
            border-radius: 20px;
            padding: 25px 30px;
            min-width: 420px;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.9),
                0 0 60px rgba(74, 222, 128, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(74, 222, 128, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-icon {
            font-size: 42px;
            margin-bottom: 8px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
        }

        .drug-type {
            text-align: center;
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-label {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-percent {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-bar-container {
            height: 40px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(74, 222, 128, 0.3);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--color-1), var(--color-2));
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 100%);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(74, 222, 128, 0.2);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(74, 222, 128, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.3);
        }

        .stat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-icon {
            font-size: 20px;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            text-align: center;
        }

        .timer-box {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(74, 222, 128, 0.5);
            position: relative;
            overflow: hidden;
        }

        .timer-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timer-label {
            color: rgba(0, 0, 0, 0.7);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }

        .timer-value {
            font-size: 40px;
            font-weight: 900;
            color: white;
            font-family: 'Courier New', monospace;
            letter-spacing: 6px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }

        .close-hint {
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 12px;
            font-style: italic;
        }

        .close-hint kbd {
            background: rgba(74, 222, 128, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(74, 222, 128, 0.4);
            font-family: 'Courier New', monospace;
            color: #4ade80;
            font-size: 11px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="content">
                <div class="header">
                    <div class="header-icon">🌱</div>
                    <div class="header-title">État Plante</div>
                </div>

                <div class="drug-type" id="drugType">Cannabis</div>

                <div class="progress-section">
                    <div class="progress-header">
                        <span class="progress-label">Croissance</span>
                        <span class="progress-percent" id="percentText">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"
                             style="width: 0%; --color-1: #ef4444; --color-2: #dc2626;">
                        </div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-header">
                            <span class="stat-icon">💧</span>
                            <span class="stat-label">Arrosage</span>
                        </div>
                        <div class="stat-value" id="waterStatus">❌</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">
                            <span class="stat-icon">🌱</span>
                            <span class="stat-label">Engrais</span>
                        </div>
                        <div class="stat-value" id="fertStatus">❌</div>
                    </div>
                </div>

                <div class="timer-box">
                    <div class="timer-label">⏱️ Temps Restant</div>
                    <div class="timer-value" id="timerValue">00:00</div>
                </div>

                <div class="close-hint">
                    Appuyez sur <kbd>X</kbd> ou <kbd>ESC</kbd> pour fermer
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log('%c[ZDRUGS NUI] Script chargé avec succès!', 'color: #4ade80; font-weight: bold; font-size: 14px;');
        console.log('[ZDRUGS NUI] Attente de messages...');

        window.addEventListener('message', (event) => {
            console.log('%c[ZDRUGS NUI] MESSAGE REÇU:', 'color: #fbbf24; font-weight: bold;', event.data);

            const data = event.data;

            if (data.action === 'show') {
                console.log('[ZDRUGS NUI] Action = SHOW, affichage du NUI');

                const app = document.getElementById('app');

                if (!app) {
                    console.error('[ZDRUGS NUI] ERREUR: Element #app introuvable!');
                    return;
                }

                console.log('[ZDRUGS NUI] Element #app trouvé, ajout de la classe "show"');
                app.classList.add('show');

                // Type de drogue
                const drugLabel = data.drugLabel || 'Plante';
                console.log('[ZDRUGS NUI] Drug label:', drugLabel);
                document.getElementById('drugType').textContent = drugLabel;

                // Pourcentage
                const percent = data.growthPercent || 0;
                console.log('[ZDRUGS NUI] Growth percent:', percent);
                document.getElementById('percentText').textContent = percent + '%';

                // Barre de progression
                const bar = document.getElementById('progressBar');
                bar.style.width = percent + '%';

                // Couleurs dynamiques
                let colorName = 'rouge';
                if (percent >= 100) {
                    bar.style.setProperty('--color-1', '#4ade80');
                    bar.style.setProperty('--color-2', '#22c55e');
                    colorName = 'vert';
                } else if (percent >= 66) {
                    bar.style.setProperty('--color-1', '#fbbf24');
                    bar.style.setProperty('--color-2', '#f59e0b');
                    colorName = 'jaune';
                } else if (percent >= 33) {
                    bar.style.setProperty('--color-1', '#fb923c');
                    bar.style.setProperty('--color-2', '#f97316');
                    colorName = 'orange';
                } else {
                    bar.style.setProperty('--color-1', '#ef4444');
                    bar.style.setProperty('--color-2', '#dc2626');
                    colorName = 'rouge';
                }
                console.log('[ZDRUGS NUI] Couleur barre:', colorName);

                // Statuts
                document.getElementById('waterStatus').textContent = data.watered ? '✅' : '❌';
                document.getElementById('fertStatus').textContent = data.fertilized ? '✅' : '❌';
                console.log('[ZDRUGS NUI] Arrosage:', data.watered, '| Engrais:', data.fertilized);

                // Timer
                const timeText = data.timeText || '00:00';
                document.getElementById('timerValue').textContent = timeText;
                console.log('[ZDRUGS NUI] Temps restant:', timeText);

                console.log('%c[ZDRUGS NUI] ✓ NUI AFFICHÉ AVEC SUCCÈS!', 'color: #22c55e; font-weight: bold; font-size: 16px;');
            }

            if (data.action === 'hide') {
                console.log('[ZDRUGS NUI] Action = HIDE, masquage du NUI');
                document.getElementById('app').classList.remove('show');
                console.log('[ZDRUGS NUI] NUI masqué');
            }
        });

        // Test au chargement
        console.log('[ZDRUGS NUI] Test des éléments DOM:');
        console.log('  - #app:', document.getElementById('app') ? '✓ OK' : '✗ MANQUANT');
        console.log('  - #drugType:', document.getElementById('drugType') ? '✓ OK' : '✗ MANQUANT');
        console.log('  - #progressBar:', document.getElementById('progressBar') ? '✓ OK' : '✗ MANQUANT');
        console.log('%c[ZDRUGS NUI] Prêt à recevoir des messages!', 'color: #4ade80; font-weight: bold;');
    </script>
</body>
</html>
